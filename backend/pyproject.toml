[project]
name = "portfolio-api"
version = "0.1.0"
description = "Portfolio d'Ingénieur Polyglotte — API d'équipe (FastAPI + MongoDB + Neo4j)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    # MongoDB : PyMongo Async (successeur officiel de Motor, déprécié depuis 2025).
    "motor>=3.0.0",
    # L'API est quasi identique à Motor : AsyncMongoClient(...)[db][collection], await find_one(...), etc.
    "pymongo>=4.13",
    "neo4j>=5.15",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
